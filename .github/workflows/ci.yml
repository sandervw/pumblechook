# Checks every PR and every merge to main.
# Node steps start once the scaffold adds package-lock.json.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: "24"
          cache: npm

      - name: Install checker tools
        run: python -m pip install ruff

      - name: Install packages
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Simple-code checks
        run: python .claude/skills/simple-code/scripts/check_code.py .

      - name: Boundary check
        if: hashFiles('package-lock.json') != ''
        run: npm run boundaries

      - name: Build
        if: hashFiles('package-lock.json') != ''
        run: npm run build

      - name: Install the test browser
        if: hashFiles('package-lock.json') != ''
        run: npx playwright install --with-deps chromium

      - name: Black-box tests
        if: hashFiles('package-lock.json') != ''
        run: npx playwright test --project=local

      - name: Integration tests
        if: hashFiles('package-lock.json') != ''
        run: npm run test:integration
