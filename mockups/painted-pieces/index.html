<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup: painted pieces</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Pirata+One&display=swap" />
    <link rel="stylesheet" href="../shared/scene.css" />
    <link rel="stylesheet" href="scene.css" />
  </head>
  <body>
    <svg id="scene" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
          <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity="0.6" />
        </filter>
        <radialGradient id="vignette" cx="0.45" cy="0.45" r="0.75">
          <stop offset="0.45" stop-color="#000" stop-opacity="0" />
          <stop offset="1" stop-color="#000" stop-opacity="0.72" />
        </radialGradient>
      </defs>

      <image href="art/background.jpg" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
      <image href="art/floor.webp" x="-10" y="384" width="980" height="196" preserveAspectRatio="none" filter="url(#shadow)" />
      <g class="words owner">
        <image href="art/rib.webp" x="538" y="262" width="424" height="290" preserveAspectRatio="none" filter="url(#shadow)" />
        <g id="rib"></g>
      </g>
      <g id="arms" class="words"></g>
      <g id="swarm" filter="url(#shadow)"></g>
      <image
        href="art/body.webp"
        x="-390"
        y="-530"
        width="780"
        height="530"
        preserveAspectRatio="none"
        transform="translate(-115 -125) rotate(135)"
        filter="url(#shadow)"
      />
      <g id="eyes"></g>
      <rect width="960" height="540" fill="url(#vignette)" pointer-events="none" />
    </svg>
    <script type="module" src="scene.js"></script>
  </body>
</html>
