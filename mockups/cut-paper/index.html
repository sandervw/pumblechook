<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mockup: cut paper</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Pirata+One&display=swap" />
    <link rel="stylesheet" href="../shared/scene.css" />
  </head>
  <body>
    <svg id="scene" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="rust" patternUnits="userSpaceOnUse" width="960" height="540">
          <image href="art/rust.jpg" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        </pattern>
        <pattern id="rust-dark" patternUnits="userSpaceOnUse" width="960" height="540">
          <image href="art/rust-dark.jpg" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        </pattern>
        <pattern id="bone" patternUnits="userSpaceOnUse" width="960" height="540">
          <image href="art/bone.jpg" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        </pattern>
        <pattern id="floor" patternUnits="userSpaceOnUse" width="960" height="540">
          <image href="art/floor.jpg" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
        </pattern>
        <pattern id="yellow" patternUnits="userSpaceOnUse" width="240" height="240">
          <image href="art/yellow.jpg" width="240" height="240" />
        </pattern>
        <pattern id="lime" patternUnits="userSpaceOnUse" width="120" height="120">
          <image href="art/lime.jpg" width="120" height="120" />
        </pattern>

        <!-- Wobbles an edge like scissors, then drops a paper shadow. -->
        <filter id="cut" x="-10%" y="-10%" width="120%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="wobble" />
          <feDisplacementMap in="SourceGraphic" in2="wobble" scale="6" xChannelSelector="R" yChannelSelector="G" result="cut" />
          <feDropShadow in="cut" dx="2" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity="0.6" />
        </filter>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
          <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.6" />
        </filter>

        <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="150" cy="140" r="820">
          <stop offset="0" stop-color="#ffc45a" stop-opacity="0.78" />
          <stop offset="0.22" stop-color="#ff8a2a" stop-opacity="0.3" />
          <stop offset="0.6" stop-color="#2a0500" stop-opacity="0.12" />
          <stop offset="1" stop-color="#150200" stop-opacity="0.62" />
        </radialGradient>
        <radialGradient id="eye-glow">
          <stop offset="0" stop-color="#fff6a8" stop-opacity="0.85" />
          <stop offset="0.6" stop-color="#ffc21f" stop-opacity="0.1" />
          <stop offset="1" stop-color="#7a3a00" stop-opacity="0.65" />
        </radialGradient>
        <linearGradient id="floor-shade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e7c25a" stop-opacity="0.22" />
          <stop offset="1" stop-color="#050a06" stop-opacity="0.72" />
        </linearGradient>
        <linearGradient id="rib-shade" gradientUnits="userSpaceOnUse" x1="545" y1="540" x2="935" y2="285">
          <stop offset="0" stop-color="#3b2a12" stop-opacity="0.38" />
          <stop offset="0.5" stop-color="#fff3d0" stop-opacity="0.12" />
          <stop offset="1" stop-color="#3b2a12" stop-opacity="0.3" />
        </linearGradient>
        <linearGradient id="shaft-light" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bfe9df" stop-opacity="0.17" />
          <stop offset="1" stop-color="#bfe9df" stop-opacity="0" />
        </linearGradient>
        <radialGradient id="vignette" cx="0.45" cy="0.45" r="0.75">
          <stop offset="0.45" stop-color="#000" stop-opacity="0" />
          <stop offset="1" stop-color="#000" stop-opacity="0.72" />
        </radialGradient>

        <g id="fish">
          <path d="M -9 0 C -5 -5 3 -5 7 0 L 12 -4 L 12 4 L 7 0 C 3 5 -5 5 -9 0 Z" fill="url(#lime)" />
          <circle cx="-5" cy="-0.6" r="0.9" fill="#1b1a10" />
        </g>
      </defs>

      <image href="art/ground.jpg" width="960" height="540" preserveAspectRatio="xMidYMid slice" />
      <g id="light">
        <polygon class="shaft" points="520,0 640,0 520,470 360,470" fill="url(#shaft-light)" />
        <polygon class="shaft" points="700,0 780,0 720,430 610,430" fill="url(#shaft-light)" />
        <polygon class="shaft" points="850,0 960,0 960,380 800,400" fill="url(#shaft-light)" />
      </g>
      <g id="sea-floor" filter="url(#cut)">
        <polygon points="-20,470 120,452 260,480 420,462 560,490 700,470 830,494 980,466 980,560 -20,560" fill="url(#floor)" />
        <polygon points="-20,470 120,452 260,480 420,462 560,490 700,470 830,494 980,466 980,560 -20,560" fill="url(#floor-shade)" />
      </g>
      <g id="rib" class="words owner"></g>
      <g id="arms" class="words"></g>
      <g id="swarm" filter="url(#shadow)"></g>
      <g id="body" filter="url(#cut)">
        <ellipse cx="15" cy="25" rx="315" ry="285" fill="url(#rust)" />
        <ellipse cx="15" cy="25" rx="315" ry="285" fill="url(#glow)" />
      </g>
      <g id="eyes"></g>
      <rect width="960" height="540" fill="url(#vignette)" pointer-events="none" />
    </svg>
    <script type="module" src="scene.js"></script>
  </body>
</html>
